[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lacuna-etl"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "typer>=0.12",
    "tqdm>=4.66",
    "pandas>=2.2",
    "pyarrow>=16",
    "pyyaml>=6",
    "polars>=1.0",
    "orjson>=3.10",
    "ijson>=3.5.0",
]

[project.scripts]
etl = "lacuna_etl.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
